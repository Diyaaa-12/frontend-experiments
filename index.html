<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Feedback Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            background: #2c3e50;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        button:hover {
            background: #1a252f;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #2c3e50;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>Student Feedback Form</h1>
    <p>Class Assessment Project</p>
</header>

<div class="container">
    <form>
        <label>Name:</label>
        <input type="text" required>

        <label>Email:</label>
        <input type="email" required>

        <label>Course:</label>
        <select>
            <option>Computer Science</option>
            <option>Artificial Intelligence</option>
            <option>Data Science</option>
        </select>

        <label>Rate the Course:</label>
        <input type="radio" name="rating"> Excellent
        <input type="radio" name="rating"> Good
        <input type="radio" name="rating"> Average

        <label>Comments:</label>
        <textarea rows="4"></textarea>

        <button type="submit">Submit Feedback</button>
    </form>
</div>

<footer>
    <p>© 2026 Student Project</p>
</footer>

</body>
</html>
